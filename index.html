<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkTrack — Enterprise System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222538;
  --surface3: #2a2f45;
  --border: #2e3350;
  --border2: #3a4060;
  --accent: #6c63ff;
  --accent2: #8b85ff;
  --accent-dim: rgba(108,99,255,0.15);
  --text: #e8eaf6;
  --text2: #9da3c2;
  --text3: #5a6080;
  --green: #4caf7d;
  --green-dim: rgba(76,175,125,0.15);
  --amber: #f0a041;
  --amber-dim: rgba(240,160,65,0.15);
  --red: #e05555;
  --red-dim: rgba(224,85,85,0.15);
  --blue: #4a9eff;
  --blue-dim: rgba(74,158,255,0.15);
  --purple: #b06cf5;
  --purple-dim: rgba(176,108,245,0.15);
  --cyan: #2dd4bf;
  --cyan-dim: rgba(45,212,191,0.15);
  --radius: 10px;
  --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
.screen { display: none; }
.screen.active { display: flex; min-height: 100vh; }

/* LOGIN */
#login-screen { align-items: center; justify-content: center; background: var(--bg); }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px; width: 440px; }
.login-logo { text-align: center; margin-bottom: 40px; }
.login-logo h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); }
.login-logo h1 span { color: var(--accent2); }
.login-logo p { color: var(--text2); margin-top: 6px; font-size: 13px; }
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
.field input, .field select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border 0.2s; }
.field input:focus, .field select:focus { border-color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: var(--radius); border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--accent2); }
.btn-sm { padding: 7px 14px; font-size: 13px; width: auto; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(224,85,85,0.3); }
.btn-success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(76,175,125,0.3); }
.btn-warning { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,160,65,0.3); }
.btn-cyan { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(45,212,191,0.3); }
.login-divider { text-align: center; margin: 20px 0; color: var(--text3); font-size: 12px; }
.role-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
.role-btns-row2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.role-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.2s; }
.role-btn:hover, .role-btn.selected { border-color: var(--accent); background: var(--accent-dim); }
.role-btn .rb-icon { font-size: 18px; margin-bottom: 4px; }
.role-btn .rb-label { font-size: 11px; font-weight: 500; color: var(--text2); }
.role-btn.selected .rb-label { color: var(--accent2); }
.error-msg { background: var(--red-dim); border: 1px solid rgba(224,85,85,0.3); color: var(--red); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; display: none; }

/* APP LAYOUT */
#app-screen { flex-direction: row; }
.sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
.sidebar-logo h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.sidebar-logo h2 span { color: var(--accent2); }
.sidebar-logo .role-badge { font-size: 11px; color: var(--text3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.sidebar-user { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.sidebar-user-info .name { font-size: 13px; font-weight: 500; }
.sidebar-user-info .role { font-size: 11px; color: var(--text3); }
.nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; color: var(--text2); transition: all 0.15s; font-size: 13px; font-weight: 500; border-left: 3px solid transparent; }
.nav-item:hover { color: var(--text); background: var(--surface2); }
.nav-item.active { color: var(--accent2); background: var(--accent-dim); border-left-color: var(--accent); }
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
.nav-section-title { padding: 16px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); font-weight: 500; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.logout-btn { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius); padding: 9px; cursor: pointer; font-family: inherit; font-size: 13px; transition: all 0.2s; }
.logout-btn:hover { border-color: var(--red); color: var(--red); }
.main { flex: 1; overflow-y: auto; background: var(--bg); }
.page { display: none; padding: 32px; }
.page.active { display: block; }
.page-header { margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; }
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
.page-sub { color: var(--text2); font-size: 13px; margin-top: 4px; }

/* CARDS & PANELS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; }
.card-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.4px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
.stat-val { font-size: 28px; font-weight: 600; letter-spacing: -1px; margin-bottom: 4px; font-family: 'DM Mono', monospace; }
.stat-label { font-size: 12px; color: var(--text2); font-weight: 500; }
.stat-change { font-size: 12px; margin-top: 6px; }

/* TABLES */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 14px; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; border-bottom: 1px solid var(--border); }
td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }

/* BADGES */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-assigned { background: var(--blue-dim); color: var(--blue); }
.badge-progress { background: var(--accent-dim); color: var(--accent2); }
.badge-hold { background: var(--amber-dim); color: var(--amber); }
.badge-completed { background: var(--green-dim); color: var(--green); }
.badge-supervisor { background: var(--purple-dim); color: var(--purple); }
.badge-manager { background: var(--cyan-dim); color: var(--cyan); }
.badge-md { background: rgba(240,160,65,0.2); color: var(--amber); }
.badge-ceo { background: rgba(224,85,85,0.2); color: var(--red); }
.badge-executive { background: var(--blue-dim); color: var(--blue); }
.badge-admin { background: var(--red-dim); color: var(--red); }
.badge-pending-approval { background: rgba(240,160,65,0.2); color: var(--amber); border: 1px solid rgba(240,160,65,0.4); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 28px; width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* TASK CARDS */
.task-list { display: flex; flex-direction: column; gap: 10px; }
.task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; display: flex; align-items: center; gap: 14px; transition: border 0.2s; }
.task-card:hover { border-color: var(--border2); }
.task-info { flex: 1; }
.task-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.task-meta { font-size: 12px; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.task-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-assigned { background: var(--blue); }
.dot-progress { background: var(--accent2); }
.dot-hold { background: var(--amber); }
.dot-completed { background: var(--green); }
.dot-pending { background: var(--amber); }

/* TIMER */
.timer-display { font-family: 'DM Mono', monospace; font-size: 48px; font-weight: 500; letter-spacing: -2px; color: var(--text); text-align: center; padding: 32px 0; }
.timer-controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
.active-task-bar { background: var(--accent-dim); border: 1px solid rgba(108,99,255,0.3); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }

/* DASHBOARD CHARTS */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.progress-bar-wrap { margin-bottom: 12px; }
.progress-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.progress-bar { height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

/* DONUT */
.donut-wrap { display: flex; align-items: center; gap: 24px; }
.donut-legend { display: flex; flex-direction: column; gap: 10px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* USER LIST */
.user-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.user-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; text-align: center; }
.user-card .avatar { margin: 0 auto 10px; width: 44px; height: 44px; font-size: 16px; }
.user-card .u-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.user-card .u-role { font-size: 11px; color: var(--text3); margin-bottom: 10px; }

/* HOLD TASK SELECTOR */
.hold-task-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
.hold-task-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; cursor: pointer; transition: all 0.15s; }
.hold-task-item:hover { border-color: var(--accent); background: var(--accent-dim); }
.hold-task-item .ht-title { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
.hold-task-item .ht-meta { font-size: 12px; color: var(--text2); }

/* REMINDERS */
.reminder-banner { background: var(--red-dim); border: 1px solid rgba(224,85,85,0.3); border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 20px; }
.reminder-banner.warning { background: var(--amber-dim); border-color: rgba(240,160,65,0.3); }
.reminder-banner-title { font-size: 13px; font-weight: 600; color: var(--red); margin-bottom: 8px; }
.reminder-banner.warning .reminder-banner-title { color: var(--amber); }
.reminder-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(224,85,85,0.1); font-size: 12px; }
.reminder-banner.warning .reminder-item { border-bottom-color: rgba(240,160,65,0.1); }
.reminder-item:last-child { border-bottom: none; }
.overdue-badge { background: var(--red-dim); color: var(--red); border: 1px solid rgba(224,85,85,0.4); border-radius: 12px; padding: 2px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.hold-badge { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(240,160,65,0.4); border-radius: 12px; padding: 2px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.due-soon-badge { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(74,158,255,0.4); border-radius: 12px; padding: 2px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; }

/* DEPT DASHBOARD */
.dept-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.dept-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; position: relative; overflow: hidden; }
.dept-kpi-val { font-size: 26px; font-weight: 700; letter-spacing: -1px; font-family: 'DM Mono', monospace; margin-bottom: 3px; }
.dept-kpi-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 500; }
.dept-kpi-sub { font-size: 11px; margin-top: 5px; }
.dept-header-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding: 16px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.dept-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.dept-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.dept-subtitle { font-size: 12px; color: var(--text3); margin-top: 2px; }
.metric-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.metric-row:last-child { border-bottom: none; }
.metric-name { color: var(--text2); }
.metric-val { font-weight: 600; font-family: 'DM Mono', monospace; }
.sparkline-wrap { display: flex; align-items: flex-end; gap: 3px; height: 32px; }
.spark-bar { width: 10px; border-radius: 3px 3px 0 0; transition: opacity 0.2s; }
.spark-bar:hover { opacity: 0.7; }
.funnel-wrap { display: flex; flex-direction: column; gap: 6px; }
.funnel-row { display: flex; align-items: center; gap: 10px; }
.funnel-label { width: 110px; font-size: 12px; color: var(--text2); text-align: right; flex-shrink: 0; }
.funnel-bar-outer { flex: 1; height: 22px; background: var(--surface3); border-radius: 4px; overflow: hidden; }
.funnel-bar-inner { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: #fff; transition: width 0.6s ease; }
.funnel-pct { width: 40px; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }

/* RISK ENGINE */
.risk-alert { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
.risk-alert.high { background: var(--red-dim); border: 1px solid rgba(224,85,85,0.4); }
.risk-alert.medium { background: var(--amber-dim); border: 1px solid rgba(240,160,65,0.4); }
.risk-alert.low { background: var(--blue-dim); border: 1px solid rgba(74,158,255,0.4); }
.risk-icon { font-size: 20px; flex-shrink: 0; }
.risk-content { flex: 1; }
.risk-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.risk-high .risk-title { color: var(--red); }
.risk-medium .risk-title { color: var(--amber); }
.risk-actions-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* APPROVAL FLOW */
.approval-flow { display: flex; align-items: center; gap: 0; margin-bottom: 24px; flex-wrap: wrap; }
.flow-step { display: flex; align-items: center; }
.flow-node { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.flow-node.active { background: var(--accent-dim); color: var(--accent2); border: 1px solid var(--accent); }
.flow-node.done { background: var(--green-dim); color: var(--green); border: 1px solid rgba(76,175,125,0.4); }
.flow-node.pending { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
.flow-arrow { color: var(--text3); padding: 0 6px; font-size: 16px; }

/* MD/CEO exclusive styles */
.exec-banner { border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
.trend-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.trend-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; }

/* WORK TYPE TREE */
.work-type-tree { display: flex; flex-direction: column; gap: 8px; }
.wt-main { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.wt-main-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; }
.wt-main-name { font-size: 13px; font-weight: 500; }
.wt-subs { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.wt-sub { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface3); border-radius: 7px; font-size: 12px; color: var(--text2); }
.wt-add { display: flex; gap: 8px; margin-top: 8px; }
.wt-add input { flex: 1; background: var(--surface3); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 12px; font-family: inherit; outline: none; }
.wt-add input:focus { border-color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
select option { background: var(--surface2); }

/* TIMELINE */
.timeline { display: flex; flex-direction: column; gap: 2px; }
.tl-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
.tl-time { color: var(--text3); width: 50px; font-family: 'DM Mono', monospace; font-size: 11px; }
.tl-bar { flex: 1; height: 20px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 11px; overflow: hidden; white-space: nowrap; }

/* MOBILE */
.hamburger { display: none; position: fixed; top: 14px; left: 14px; z-index: 200; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; font-size: 18px; line-height: 1; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 149; }
.sidebar-backdrop.open { display: block; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface3); border: 1px solid var(--border2); color: var(--text); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s; white-space: nowrap; }
.toast.show { opacity: 1; }
.toast.toast-success { background: var(--green-dim); border-color: rgba(76,175,125,0.4); color: var(--green); }
.toast.toast-error { background: var(--red-dim); border-color: rgba(224,85,85,0.4); color: var(--red); }

@media (max-width: 768px) {
  .hamburger { display: flex; align-items: center; justify-content: center; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 150; transform: translateX(-100%); transition: transform 0.25s ease; width: 260px; }
  .sidebar.open { transform: translateX(0); }
  #app-screen { flex-direction: column; }
  .main { padding-top: 0; width: 100%; }
  .page { padding: 64px 16px 24px; }
  .login-box { width: 92vw; padding: 32px 24px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .chart-grid { grid-template-columns: 1fr; }
  .dept-kpi-grid { grid-template-columns: 1fr 1fr; }
  .trend-grid { grid-template-columns: 1fr; }
  .user-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .role-btns { grid-template-columns: repeat(3, 1fr); }

function populateUserDropdown(role) {
  const sel = document.getElementById('login-username');
  let filtered = store.users;
  if (role === 'manager') filtered = store.users.filter(u => u.role && u.role.toLowerCase() === 'manager');

  if (filtered.length === 0 && store.users.length === 0) {
    sel.innerHTML = '<option value="">— loading users… —</option>';
  }
}

function doLogin() {
  const pw  = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  const btn = document.querySelector('#login-screen .btn-primary');
  err.style.display = 'none';
  if (!pw) { err.style.display = 'block'; err.textContent = 'Please enter your password.'; return; }

  const uid = (loginRole === 'manager' || loginRole === 'user')
    ? document.getElementById('login-username').value : '';
  if ((loginRole === 'manager' || loginRole === 'user') && !uid) {
    err.style.display = 'block'; err.textContent = 'Please select a user.'; return;
  }

  btn.textContent = 'Signing in…'; btn.disabled = true;

  const url = API_URL + '?type=login&role=' + loginRole +
    '&password=' + encodeURIComponent(pw) +
    (uid ? '&userId=' + encodeURIComponent(uid) : '') +
    '&t=' + Date.now();

  fetch(url)
    .then(r => r.json())
    .then(res => {
      btn.textContent = 'Sign In'; btn.disabled = false;
      if (res.status !== 'success') {
        err.style.display = 'block';
        err.textContent = res.message || 'Login failed.';
        return;
      }
      currentUser = res.user;
      // Ensure boolean flags are set correctly
      if (currentUser.role === 'Admin')   currentUser.isAdmin   = true;
      if (currentUser.role === 'MD')      currentUser.isMD      = true;
      if (currentUser.role === 'CEO')     currentUser.isCEO     = true;
      if (currentUser.role === 'Manager') currentUser.isManager = true;

      runRiskEngine();
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('app-screen').classList.add('active');
      setupApp();
      startPolling();
    })
    .catch(() => {
      btn.textContent = 'Sign In'; btn.disabled = false;
      err.style.display = 'block';
      err.textContent = 'Cannot reach server. Check your internet connection.';
    });
}

function runRiskEngine() {
  const risks = [];
  store.tasks.forEach(t => {
    if (t.status === 'Completed') return;
    const delta = getDueDelta(t.dueDate);
    if (delta.days > 3 && t.status !== 'Completed') {
      risks.push({ level: 'high', task: t, type: 'overdue', msg: `Task "${t.title}" is ${delta.label} (${t.dept})`, action: null });
    }
    if (t.priority === 'High' && t.status === 'On Hold') {
      risks.push({ level: 'high', task: t, type: 'blocked', msg: `High priority task "${t.title}" is blocked (${t.dept})`, action: null });
    }
    if (t.status === 'On Hold' && delta.days > 0) {
      risks.push({ level: 'medium', task: t, type: 'stalled', msg: `Task "${t.title}" stalled on hold + overdue`, action: null });
    }
  });
  // Dept efficiency check
  DEPARTMENTS.forEach(dept => {
    const deptTasks = store.tasks.filter(t => t.dept === dept);
    if (deptTasks.length === 0) return;
    const done = deptTasks.filter(t => t.status === 'Completed').length;
    const efficiency = Math.round((done / deptTasks.length) * 100);
    if (efficiency < 30 && deptTasks.length >= 2) {
      risks.push({ level: 'medium', dept, type: 'efficiency', msg: `${dept} dept efficiency low: ${efficiency}% completion rate`, action: null });
    }
  });
  store.riskAlerts = risks;
}

function renderTaskRows(tasks) {
  return tasks.map(t => {

    const dueBadge = t.status === 'Completed'

      : delta.status === 'overdue'
        ? `<span class="overdue-badge">⏰ ${delta.label}</span>`

          ? `<span class="due-soon-badge">📅 ${delta.label}</span>`

    return `<tr>

function filterManagerTasks(status) {
  const dept = currentUser.dept;

function mdAction(taskId, decision) {
  const task = store.tasks.find(t => t.id === taskId);
  if (!task) return;
  if (decision === 'approve') { task.approvalStatus = 'approved'; task.needsApproval = false; }
  if (decision === 'reject') { task.approvalStatus = 'rejected'; }
  if (decision === 'override') { task.status = 'In Progress'; task.approvalStatus = 'approved'; }
  if (decision === 'escalate') { task.priority = 'High'; showToast('↑ Task escalated to High priority', 'success'); }
  store.mdDecisions.push({ taskTitle: task.title, decision, time: new Date().toLocaleTimeString() });
  runRiskEngine();
  showToast(`✅ Decision recorded: ${decision}`, 'success');
  navigateTo(currentPage);
}

function renderMyTasks() {
  const myTasks = store.tasks.filter(t => t.assignedTo === currentUser.id);
  return `
    <div class="page-header">
      <div><div class="page-title">My Tasks</div><div class="page-sub">${myTasks.length} tasks assigned</div></div>
      <button class="btn btn-primary btn-sm" onclick="openCreateTask()">+ Create Task</button>
    </div>
    <div class="task-list">
      ${myTasks.length ? myTasks.map(t => renderTaskCard(t)).join('') : '<div class="card" style="text-align:center;padding:40px;color:var(--text3)">No tasks assigned yet.</div>'}
    </div>`;
}

function renderTaskCard(t) {
  const wt = store.workTypes.find(w => w.id === t.workType);
  const assignee = store.users.find(u => u.id === t.assignedTo);
  const isActive = !!store.activeTimers[t.id];
  const dot = t.status === 'In Progress' ? 'progress' : t.status === 'On Hold' ? 'hold' : t.status === 'Completed' ? 'completed' : 'assigned';
  const delta = getDueDelta(t.dueDate);
  const dueBadgeHtml = t.status !== 'Completed'
    ? (delta.status === 'overdue' ? `<span class="overdue-badge">⏰ ${delta.label}</span>` : delta.status === 'due-soon' ? `<span class="due-soon-badge">📅 ${delta.label}</span>` : '')
    : '';
  let actions = '';
  if (t.assignedTo === currentUser.id || currentUser.isAdmin) {
    if (t.status === 'Assigned') actions += `<button class="btn btn-primary btn-sm" onclick="updateTaskStatus('${t.id}','In Progress')">Start</button>`;
    if (t.status === 'In Progress') {
      actions += isActive
        ? `<button class="btn btn-warning btn-sm" onclick="stopTimer('${t.id}');navigateTo('${currentPage}')">■ Stop</button>`
        : `<button class="btn btn-success btn-sm" onclick="startTimer('${t.id}');navigateTo('${currentPage}')">▶ Track</button>`;
      actions += `<button class="btn btn-warning btn-sm" onclick="updateTaskStatus('${t.id}','On Hold')">Hold</button>`;
      actions += `<button class="btn btn-success btn-sm" onclick="updateTaskStatus('${t.id}','Completed')">✓ Done</button>`;
    }
    if (t.status === 'On Hold') {
      actions += `<button class="btn btn-ghost btn-sm" onclick="updateTaskStatus('${t.id}','In Progress')">Resume</button>`;
    }
  }
  actions += `<button class="btn btn-ghost btn-sm" onclick="openTaskDetail('${t.id}')">Detail</button>`;
  // Delete only for tasks the current user created (not ones created by manager/admin/ceo)
  const canDelete = t.createdBy === currentUser.id;
  if (canDelete) {
    actions += `<button class="btn btn-danger btn-sm" onclick="deleteOwnTask('${t.id}')">🗑</button>`;
  }
  return `
    <div class="task-card" id="tc-${t.id}">
      <div class="dot dot-${dot}"></div>
      <div class="task-info">
        <div class="task-title">${wt ? wt.name : t.dept || '?'} — ${t.subCategory} ${isActive ? '<span style="font-size:11px;color:var(--green)">● LIVE</span>' : ''}</div>
        <div class="task-meta">
          <span>Due: ${t.dueDate}</span>
          ${dueBadgeHtml}
          ${assignee && t.assignedTo !== currentUser.id ? `<span>→ ${assignee.name}</span>` : ''}
          ${statusBadge(t.status)}
          ${priorityBadge(t.priority)}
          ${t.needsApproval ? `<span class="badge badge-pending-approval" style="font-size:10px">Needs Approval</span>` : ''}
          ${t.description ? `<span style="font-size:11px;color:var(--text3);font-style:italic">${t.description}</span>` : ''}
        </div>
      </div>
      <div class="task-actions">${actions}</div>
    </div>`;
}

    <div style="text-align:center;margin-bottom:24px;">
      ${!activeTask ? `

          <select id="tracker-task-sel">
            <option value="">— select task —</option>

          </select>
        </div>
        <button class="btn btn-primary" onclick="startTimerFromTracker()">▶ Start Timer</button>` :
        `<button class="btn btn-danger" onclick="stopTimer('${activeTask.id}');navigateTo('tracker')">■ Stop Timer</button>`}
    </div>
    <div class="card">
      <div class="card-title">My Time Logs — Total: ${myHours.toFixed(2)}h</div>

          <thead><tr><th>Task</th><th>Date</th><th>Duration</th><th>Notes</th></tr></thead>
          <tbody>
            ${store.tasks.flatMap(t => t.logs.filter(l => l.userId === currentUser.id).map(l => {
              const dur = ((l.end || Date.now()) - l.start) / 3600000;

function afterRender(page) {
  if (page === 'tracker') {
    const activeId = Object.keys(store.activeTimers).find(k => store.activeTimers[k]);
    if (activeId) {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const el = document.getElementById('timer-display');
        if (el) el.textContent = formatTimer(Date.now() - store.activeTimers[activeId]);
        else clearInterval(timerInterval);
      }, 1000);
    }
  }
}

function hexAlpha(hex, alpha) {
  hex = hex || '#6c63ff';
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function formatTimer(ms) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}
function buildDonut(data, total) {
  const size = 100, cx = 50, cy = 50, r = 38, stroke = 12;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const slices = data.map(d => {
    const pct = total > 0 ? d.count / total : 0;
    const dash = pct * circumference;
    const s = { ...d, dash, gap: circumference - dash, offset };
    offset += dash;
    return s;
  });
  return `<svg width="110" height="110" viewBox="0 0 100 100" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface3)" stroke-width="${stroke}"/>
    ${slices.map(s => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${s.dash.toFixed(2)} ${s.gap.toFixed(2)}" stroke-dashoffset="${-s.offset.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`).join('')}
    <text x="${cx}" y="${cy + 2}" text-anchor="middle" dominant-baseline="middle" fill="var(--text)" font-size="16" font-weight="600" font-family="DM Mono">${total}</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" dominant-baseline="middle" fill="var(--text3)" font-size="7">total</text>
  </svg>`;
}

// ============================================================
//  REMINDER UTILITIES
// ============================================================
function getDueDelta(dueDateStr) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(dueDateStr); due.setHours(0, 0, 0, 0);
  const diffDays = Math.round((today - due) / 86400000);
  if (diffDays > 0) {
    if (diffDays >= 30) { const m = Math.floor(diffDays / 30); return { days: diffDays, label: `${m}mo${diffDays%30>0?` ${diffDays%30}d`:''} overdue`, status: 'overdue' }; }
    return { days: diffDays, label: `${diffDays}d overdue`, status: 'overdue' };
  } else if (diffDays === 0) {
    return { days: 0, label: 'Due today', status: 'due-soon' };
  } else if (diffDays >= -3) {
    return { days: diffDays, label: `Due in ${-diffDays}d`, status: 'due-soon' };
  }
  return { days: diffDays, label: `Due in ${-diffDays} days`, status: 'ok' };
}
function getHoldDuration(task) {
  if (task.logs && task.logs.length) {
    const last = task.logs[task.logs.length - 1];
    const days = Math.round((Date.now() - (last.end || last.start)) / 86400000);
    if (days >= 30) return `${Math.floor(days / 30)}mo on hold`;
    if (days > 0) return `${days}d on hold`;
    return 'Just put on hold';
  }
  return 'On hold';
}
function getReminderTasks() {
  const overdue = [], holdTasks = [], dueSoon = [];
  const sourceTasks = (currentUser.isManager) ? store.tasks.filter(t => t.dept === currentUser.dept) : store.tasks;
  sourceTasks.forEach(t => {
    if (t.status === 'Completed') return;
    const delta = getDueDelta(t.dueDate);
    if (t.status === 'On Hold') holdTasks.push({ task: t, delta, holdLabel: getHoldDuration(t) });
    else if (delta.status === 'overdue') overdue.push({ task: t, delta });
    else if (delta.status === 'due-soon') dueSoon.push({ task: t, delta });
  });
  return { overdue, holdTasks, dueSoon };
}

function startTimer(taskId) {
  const existing = Object.keys(store.activeTimers).find(k => store.activeTimers[k]);
  if (existing && existing !== taskId) { alert('Please stop the current timer first.'); return; }
  store.activeTimers[taskId] = Date.now();
  const task = store.tasks.find(t => t.id === taskId);
  if (task && task.status === 'Assigned') task.status = 'In Progress';
}
function stopTimer(taskId) {
  const startTime = store.activeTimers[taskId];
  if (!startTime) return;
  const endTime = Date.now();
  const notes = prompt('Add notes for this time entry (optional):') || '';
  const task = store.tasks.find(t => t.id === taskId);
  if (task) {
    task.logs.push({ userId: currentUser.id, start: startTime, end: endTime, notes });
    saveTimeLog({ userId: currentUser.id, name: currentUser.name, task: task.title, startTime: new Date(startTime).toISOString(), endTime: new Date(endTime).toISOString(), duration: (endTime - startTime) / 3600000, notes });
  }
  delete store.activeTimers[taskId];
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// ============================================================
//  RATING SYSTEM — CEO ONLY (with optional manager share)
// ============================================================
function calcTaskRating(task) {
  if (task.status !== 'Completed') return null;
  // Find the completion log (last log entry)
  const lastLog = task.logs && task.logs.length ? task.logs[task.logs.length - 1] : null;
  const completedDate = lastLog && lastLog.end ? new Date(lastLog.end) : new Date();
  const dueDate = new Date(task.dueDate); dueDate.setHours(23,59,59,0);
  const diffMs = completedDate - dueDate;
  const diffDays = diffMs / 86400000;
  let stars, label, color;
  if (diffDays < 0) { stars = 4; label = 'Before Deadline'; color = 'var(--green)'; }
  else if (diffDays <= 0.04) { stars = 3; label = 'On Time'; color = 'var(--accent2)'; }
  else if (diffDays <= 2) { stars = 2; label = 'Within 2 Days'; color = 'var(--amber)'; }
  else { stars = 1; label = 'After Deadline (+2d)'; color = 'var(--red)'; }
  return { stars, label, color, diffDays };
}

function renderStars(n, color) {
  return Array.from({length:4}, (_,i) => `<span style="font-size:18px;color:${i<n?color:'var(--surface3)'}"">★</span>`).join('');
}

function getMonthlyRatingData(monthKey) {
  // monthKey = 'YYYY-MM' or null for current month
  const now = new Date();
  const [yr, mo] = monthKey ? monthKey.split('-').map(Number) : [now.getFullYear(), now.getMonth()+1];
  const completed = store.tasks.filter(t => {
    if (t.status !== 'Completed') return false;
    const lastLog = t.logs && t.logs.length ? t.logs[t.logs.length - 1] : null;
    if (!lastLog || !lastLog.end) return false;
    const d = new Date(lastLog.end);
    return d.getFullYear() === yr && d.getMonth()+1 === mo;
  });
  // Carry over: tasks that were pending from last month (due in prev month, not yet completed)
  const pendingCarryOver = store.tasks.filter(t => {
    if (t.status === 'Completed') return false;
    const due = new Date(t.dueDate);
    return (due.getFullYear() < yr) || (due.getFullYear() === yr && due.getMonth()+1 < mo);
  });
  return { completed, pendingCarryOver, yr, mo };
}

function renderCEORatings() {
  const now = new Date();
  const months = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString('en-IN',{year:'numeric',month:'long'}) });
  }
  const selMonth = window._ratingMonth || months[0].key;
  const { completed, pendingCarryOver, yr, mo } = getMonthlyRatingData(selMonth);

  const before = completed.filter(t => calcTaskRating(t) && calcTaskRating(t).stars === 4);
  const onTime = completed.filter(t => calcTaskRating(t) && calcTaskRating(t).stars === 3);
  const within2 = completed.filter(t => calcTaskRating(t) && calcTaskRating(t).stars === 2);
  const after2 = completed.filter(t => calcTaskRating(t) && calcTaskRating(t).stars === 1);

  // Per-employee rating summary
  const empRatings = store.users.map(u => {
    const myCompleted = completed.filter(t => t.assignedTo === u.id);
    if (!myCompleted.length) return null;
    const totalStars = myCompleted.reduce((s,t) => s + (calcTaskRating(t)?.stars||0), 0);
    const avg = (totalStars / myCompleted.length).toFixed(1);
    return { user: u, completed: myCompleted.length, avg, totalStars,
      b4: myCompleted.filter(t => calcTaskRating(t)?.stars===4).length,
      on: myCompleted.filter(t => calcTaskRating(t)?.stars===3).length,
      w2: myCompleted.filter(t => calcTaskRating(t)?.stars===2).length,
      af: myCompleted.filter(t => calcTaskRating(t)?.stars===1).length };
  }).filter(Boolean).sort((a,b) => b.avg - a.avg);

  return `
    <div class="page-header">
      <div><div class="page-title">⭐ Monthly Performance Ratings</div><div class="page-sub">CEO-only view · Task completion quality</div></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select onchange="window._ratingMonth=this.value;navigateTo('ceo-ratings')" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;color:var(--text);font-family:inherit;font-size:13px;">
          ${months.map(m => `<option value="${m.key}" ${m.key===selMonth?'selected':''}>${m.label}</option>`).join('')}
        </select>
        <button class="btn ${store.ratingVisibleToManager?'btn-success':'btn-ghost'} btn-sm" onclick="toggleRatingVisibility()" style="min-width:200px;">
          ${store.ratingVisibleToManager ? '✅ Ratings Shared with Managers' : '🔒 Approve Share with Managers'}
        </button>
      </div>
    </div>

    ${!store.ratingVisibleToManager ? `<div style="background:var(--amber-dim);border:1px solid rgba(240,160,65,0.3);border-radius:var(--radius-lg);padding:12px 18px;font-size:13px;color:var(--amber);margin-bottom:20px;">🔒 Ratings are currently <strong>CEO-only</strong>. Click "Approve Share with Managers" to let managers see their team's ratings.</div>` : `<div style="background:var(--green-dim);border:1px solid rgba(76,175,125,0.3);border-radius:var(--radius-lg);padding:12px 18px;font-size:13px;color:var(--green);margin-bottom:20px;">✅ Ratings are now <strong>shared with Managers</strong>. They can see their department team's ratings.</div>`}

    <div class="stats-grid" style="grid-template-columns:repeat(5,1fr);">
      <div class="stat-card"><div class="stat-val">${completed.length}</div><div class="stat-label">Total Completed</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--green)">${before.length}</div><div class="stat-label">⭐⭐⭐⭐ Before Due</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--accent2)">${onTime.length}</div><div class="stat-label">⭐⭐⭐ On Time</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--amber)">${within2.length}</div><div class="stat-label">⭐⭐ Within 2d</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--red)">${after2.length}</div><div class="stat-label">⭐ After +2d</div></div>
    </div>

    ${pendingCarryOver.length ? `
    <div class="card" style="border-color:rgba(240,160,65,0.4);margin-bottom:20px;">
      <div class="card-title" style="color:var(--amber)">⏭ Pending Tasks Carried Over to This Month (${pendingCarryOver.length})</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Task</th><th>Dept</th><th>Assigned To</th><th>Due Date</th><th>Status</th></tr></thead>
        <tbody>${pendingCarryOver.map(t => {
          const u = store.users.find(x => x.id === t.assignedTo);
          return `<tr>
            <td><div style="font-weight:500">${t.title}</div><div style="font-size:11px;color:var(--text3)">${t.subCategory}</div></td>
            <td>${getDeptIcon(t.dept)} ${t.dept}</td>
            <td>${u ? userBadge(u) : '—'}</td>
            <td style="color:var(--red);font-size:12px">${t.dueDate}</td>
            <td>${statusBadge(t.status)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>` : ''}

    <div class="card">
      <div class="card-title">Employee Performance Summary</div>
      ${empRatings.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Employee</th><th>Dept</th><th>Tasks Done</th><th style="text-align:center">⭐⭐⭐⭐</th><th style="text-align:center">⭐⭐⭐</th><th style="text-align:center">⭐⭐</th><th style="text-align:center">⭐</th><th>Avg Rating</th></tr></thead>
        <tbody>${empRatings.map(e => {
          const avgNum = parseFloat(e.avg);
          const avgColor = avgNum >= 3.5 ? 'var(--green)' : avgNum >= 2.5 ? 'var(--accent2)' : avgNum >= 1.5 ? 'var(--amber)' : 'var(--red)';
          return `<tr>
            <td>${userBadge(e.user)}</td>
            <td style="font-size:12px;color:var(--text2)">${e.user.dept||'—'}</td>
            <td style="font-family:'DM Mono',monospace">${e.completed}</td>
            <td style="text-align:center;color:var(--green);font-weight:600">${e.b4}</td>
            <td style="text-align:center;color:var(--accent2);font-weight:600">${e.on}</td>
            <td style="text-align:center;color:var(--amber);font-weight:600">${e.w2}</td>
            <td style="text-align:center;color:var(--red);font-weight:600">${e.af}</td>
            <td><span style="font-size:16px;font-weight:700;color:${avgColor}">${renderStars(Math.round(avgNum), avgColor)} ${e.avg}</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : `<div style="text-align:center;padding:40px;color:var(--text3)">No completed tasks found for this month.</div>`}
    </div>

    <div class="card">
      <div class="card-title">All Rated Tasks — ${months.find(m=>m.key===selMonth)?.label||''}</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        ${[['All',completed.length,'var(--text2)'],['⭐⭐⭐⭐ Before Due',before.length,'var(--green)'],['⭐⭐⭐ On Time',onTime.length,'var(--accent2)'],['⭐⭐ Within 2d',within2.length,'var(--amber)'],['⭐ After +2d',after2.length,'var(--red)']].map(([l,c,col]) =>
          `<button class="btn btn-ghost btn-sm" style="font-size:12px" onclick="filterCEORatings('${l}')">${l} <strong style="color:${col}">(${c})</strong></button>`).join('')}
      </div>
      <div class="table-wrap" id="ratings-table-wrap">
        ${renderRatingRows(completed)}
      </div>
    </div>`;
}

function renderRatingRows(tasks) {
  if (!tasks.length) return '<div style="text-align:center;padding:32px;color:var(--text3)">No tasks to display</div>';
  return `<table>
    <thead><tr><th>Work Type</th><th>Activity / Task</th><th>Dept</th><th>Assigned To</th><th>Due Date</th><th>Completed</th><th>Rating</th></tr></thead>
    <tbody>${tasks.map(t => {
      const u = store.users.find(x => x.id === t.assignedTo);
      const r = calcTaskRating(t);
      if (!r) return '';
      const lastLog = t.logs && t.logs.length ? t.logs[t.logs.length-1] : null;
      const completedStr = lastLog && lastLog.end ? new Date(lastLog.end).toLocaleDateString('en-IN') : '—';
      const wt = store.workTypes.find(w => w.id === t.workType);
      return `<tr>
        <td style="font-size:12px;color:var(--text2)">${wt ? wt.name : t.dept||'—'}</td>
        <td style="font-weight:500">${t.subCategory||'—'}</td>
        <td>${getDeptIcon(t.dept)} ${t.dept||'—'}</td>
        <td>${u ? userBadge(u) : '—'}</td>
        <td style="font-size:12px;color:var(--text2)">${t.dueDate}</td>
        <td style="font-size:12px;color:var(--text2)">${completedStr}</td>
        <td><div style="display:flex;align-items:center;gap:6px;">${renderStars(r.stars, r.color)}<span style="font-size:11px;color:${r.color};font-weight:600">${r.label}</span></div></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function filterCEORatings(label) {
  const selMonth = window._ratingMonth || '';
  const { completed } = getMonthlyRatingData(selMonth);
  let filtered = completed;
  if (label.includes('Before Due')) filtered = completed.filter(t => calcTaskRating(t)?.stars===4);
  else if (label.includes('On Time')) filtered = completed.filter(t => calcTaskRating(t)?.stars===3);
  else if (label.includes('Within 2d')) filtered = completed.filter(t => calcTaskRating(t)?.stars===2);
  else if (label.includes('After +2d')) filtered = completed.filter(t => calcTaskRating(t)?.stars===1);
  const el = document.getElementById('ratings-table-wrap');
  if (el) el.innerHTML = renderRatingRows(filtered);
}

function toggleRatingVisibility() {
  store.ratingVisibleToManager = !store.ratingVisibleToManager;
  showToast(store.ratingVisibleToManager ? '✅ Ratings now visible to Managers' : '🔒 Ratings hidden from Managers', store.ratingVisibleToManager ? 'success' : 'error');
  // Re-setup nav if a manager is viewing (won't apply now since we're CEO, but after re-login it takes effect)
  navigateTo('ceo-ratings');
}

function renderManagerRatings() {
  if (!store.ratingVisibleToManager) {
    return `<div class="page-header"><div><div class="page-title">⭐ Team Ratings</div></div></div>
      <div class="card" style="text-align:center;padding:60px;"><div style="font-size:40px;margin-bottom:16px">🔒</div><div style="font-size:16px;font-weight:600">Ratings not yet approved by CEO</div><div style="color:var(--text3);margin-top:8px;font-size:13px">The CEO needs to approve sharing ratings before you can view them.</div></div>`;
  }
  const dept = currentUser.dept;
  const now = new Date();
  const months = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString('en-IN',{year:'numeric',month:'long'}) });
  }
  const selMonth = window._mgr_ratingMonth || months[0].key;
  const { completed } = getMonthlyRatingData(selMonth);
  const deptCompleted = completed.filter(t => t.dept === dept);

  const empRatings = store.users.filter(u => u.dept === dept).map(u => {
    const myC = deptCompleted.filter(t => t.assignedTo === u.id);
    if (!myC.length) return null;
    const totalStars = myC.reduce((s,t) => s + (calcTaskRating(t)?.stars||0), 0);
    const avg = (totalStars / myC.length).toFixed(1);
    return { user: u, completed: myC.length, avg,
      b4: myC.filter(t => calcTaskRating(t)?.stars===4).length,
      on: myC.filter(t => calcTaskRating(t)?.stars===3).length,
      w2: myC.filter(t => calcTaskRating(t)?.stars===2).length,
      af: myC.filter(t => calcTaskRating(t)?.stars===1).length };
  }).filter(Boolean).sort((a,b) => parseFloat(b.avg) - parseFloat(a.avg));

  return `
    <div class="page-header">
      <div><div class="page-title">⭐ Team Ratings — ${dept}</div><div class="page-sub">Shared by CEO · Read-only</div></div>
      <select onchange="window._mgr_ratingMonth=this.value;navigateTo('manager-ratings')" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;color:var(--text);font-family:inherit;font-size:13px;">
        ${months.map(m => `<option value="${m.key}" ${m.key===selMonth?'selected':''}>${m.label}</option>`).join('')}
      </select>
    </div>
    <div style="background:var(--green-dim);border:1px solid rgba(76,175,125,0.3);border-radius:var(--radius-lg);padding:12px 18px;font-size:13px;color:var(--green);margin-bottom:20px;">✅ CEO has approved sharing ratings with you.</div>
    <div class="card">
      <div class="card-title">Team Performance Summary</div>
      ${empRatings.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Employee</th><th>Tasks Done</th><th style="text-align:center">⭐⭐⭐⭐</th><th style="text-align:center">⭐⭐⭐</th><th style="text-align:center">⭐⭐</th><th style="text-align:center">⭐</th><th>Avg Rating</th></tr></thead>
        <tbody>${empRatings.map(e => {
          const avgNum = parseFloat(e.avg);
          const avgColor = avgNum >= 3.5 ? 'var(--green)' : avgNum >= 2.5 ? 'var(--accent2)' : avgNum >= 1.5 ? 'var(--amber)' : 'var(--red)';
          return `<tr>
            <td>${userBadge(e.user)}</td>
            <td>${e.completed}</td>
            <td style="text-align:center;color:var(--green);font-weight:600">${e.b4}</td>
            <td style="text-align:center;color:var(--accent2);font-weight:600">${e.on}</td>
            <td style="text-align:center;color:var(--amber);font-weight:600">${e.w2}</td>
            <td style="text-align:center;color:var(--red);font-weight:600">${e.af}</td>
            <td><span style="font-size:15px;font-weight:700;color:${avgColor}">${renderStars(Math.round(avgNum), avgColor)} ${e.avg}</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : '<div style="text-align:center;padding:32px;color:var(--text3)">No completed tasks for this month in your department.</div>'}
    </div>
    <div class="card">
      <div class="card-title">All Rated Tasks — ${dept}</div>
      ${renderRatingRows(deptCompleted)}
    </div>`;
}

// ============================================================
//  MODAL
// ============================================================
function showModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e) {
  if (e && e.target && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

// ============================================================
//  TOAST
// ============================================================
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' toast-' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 3000);
}

// ============================================================
//  MOBILE SIDEBAR
// ============================================================
function toggleSidebar() {
  const s = document.getElementById('sidebar'), b = document.getElementById('sidebar-backdrop');
  const open = s.classList.contains('open');
  s.classList.toggle('open', !open);
  b.classList.toggle('open', !open);
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}

// ============================================================
//  GOOGLE SHEETS INTEGRATION
// ============================================================
// ⚠️ PASTE YOUR NEW DEPLOYED URL HERE after redeploying Code_v3.gs
const API_URL = "https://script.google.com/macros/s/AKfycbwfogc8AjMXp1A6kkXFhX9DB6to57tG_LrAJEl3wK1SuccrqgCnW9H7_1Lx_xwIK0H2/exec";

function startPolling() {
  stopPolling();
  _pollInterval = setInterval(pollSheetsData, POLL_MS);
}
function stopPolling() {
  if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
}
function pollSheetsData() {
  fetchUsersFromSheets(function(users) {
    if (!users || !users.length) return;
    const prevCount = store.users.length;
    store.users = users;
    if (currentPage === 'users') navigateTo('users');
    if (users.length > prevCount && currentUser && currentUser.isAdmin)
      showToast('👤 New user added from Sheets!', 'success');
  });

  // Also sync tasks
  fetch(API_URL + '?type=tasks&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.status === 'success' && Array.isArray(res.data) && res.data.length) {
        const sheetIds  = res.data.map(t => t.id);
        const localOnly = store.tasks.filter(t => !sheetIds.includes(t.id));
        store.tasks = [...res.data, ...localOnly];
        if (currentPage === 'tasks-admin' || currentPage === 'my-tasks' || currentPage === 'manager-tasks')
          navigateTo(currentPage);
      }
    })
    .catch(() => {});
}
function fetchUsersFromSheets(callback) {
  fetch(API_URL + '?type=users&t=' + Date.now())
    .then(r => r.json())
    .then(res => {
      if (res.status === 'success' && Array.isArray(res.data)) callback(res.data);
      else callback(null);
    })
    .catch(() => callback(null));
}
function saveTimeLog(data) {
  fetch(API_URL, { method: 'POST', body: JSON.stringify(data) })
    .then(res => res.json())
    .then(res => { if (res.status === 'success') showToast('✅ Time log saved to Google Sheets', 'success'); else showToast('⚠️ Sheets error', 'error'); })
    .catch(() => showToast('⚠️ Could not reach Google Sheets', 'error'));
}
function loadTimeLogsFromSheets(callback) {
  fetch(API_URL + '?type=timelogs&t=' + Date.now())
    .then(r => r.json())
    .then(res => { if (res.status === 'success') callback(res.data || []); else callback([]); })
    .catch(() => callback([]));
}

function initApp() {
  const btn = document.querySelector('#login-screen .btn-primary');
  if (btn) { btn.textContent = 'Loading…'; btn.disabled = true; }

  // Load users first, then tasks
  fetchUsersFromSheets(function(users) {
    if (users && users.length) store.users = users;
    if (loginRole === 'user' || loginRole === 'manager') populateUserDropdown(loginRole);
    else { const dd = document.getElementById('field-username-login'); if (dd && dd.style.display !== 'none') populateUserDropdown(loginRole); }

    // Also load tasks from sheet
    fetch(API_URL + '?type=tasks&t=' + Date.now())
      .then(r => r.json())
      .then(res => {
        if (res.status === 'success' && Array.isArray(res.data) && res.data.length) {
          // Merge sheet tasks with default tasks, sheet takes priority
          const sheetIds = res.data.map(t => t.id);
          const localOnly = store.tasks.filter(t => !sheetIds.includes(t.id));
          store.tasks = [...res.data, ...localOnly];
        }
        if (btn) { btn.textContent = 'Sign In'; btn.disabled = false; }
      })
      .catch(() => {
        if (btn) { btn.textContent = 'Sign In'; btn.disabled = false; }
      });
  });
}

// ── Init ──────────────────────────────────────────────────────
selectLoginRole('admin');
initApp();
</script>
